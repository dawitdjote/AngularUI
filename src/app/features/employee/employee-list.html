<div class="card shadow-sm">
  <div class="card-header">
    <h4 class="mb-0">Employee List</h4>
  </div>
  
  <div class="card-body">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
       
        <tr>
          <th>Name</th>
          <th>Sex</th>
          <th>Salary</th>
          <th>Department</th>
        </tr>
      </thead>
      
      <tbody>
       <tr *ngFor="let emp of employees$ | async">
        <td>{{ emp.name }}</td>
        <td>{{ emp.sex }}</td>
        <td>{{ emp.salary }}</td>
        <td>{{ emp.department }}</td>
       </tr>
      </tbody>
    </table>
  </div>
</div>
